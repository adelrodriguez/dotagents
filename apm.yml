name: dotagents
version: 0.1.0
description: My coding-agents setup
author: Adel Rodríguez
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-bot, grok-build, hermes, kiro, opencode, vscode, windsurf
targets:
  - claude
  - codex
  - cursor
  - grok-bot
  - grok-build
  - opencode
dependencies:
  apm:
    - git: emilkowalski/skills
      skills:
        - break-ui
    - git: mattpocock/skills
      skills:
        - grilling
        - grill-me
        - wayfinder
        - domain-modeling
  mcp: []
includes: auto
scripts: {}
